:root {
    --bg: #f4f5f2;
    --panel: #ffffff;
    --ink: #15181c;
    --muted: #5d646d;
    --line: #d9ddd6;
    --field: #eef0eb;
    --accent: #0b6e4f;
    --accent-ink: #ffffff;
    --warn: #9a5b00;
    --warn-bg: #fff3dc;
    --bad: #b3261e;
    --bad-bg: #fde8e6;
    --ok-bg: #e3f2ea;
    --focus: #1a73e8;
    --scrim: rgba(10, 12, 14, 0.45);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f1214;
        --panel: #171b1e;
        --ink: #e8ebe6;
        --muted: #9aa29a;
        --line: #2a3034;
        --field: #1f2428;
        --accent: #3ccf91;
        --accent-ink: #06130d;
        --warn: #f2b14c;
        --warn-bg: #2b2210;
        --bad: #ff8a80;
        --bad-bg: #2d1514;
        --ok-bg: #12261c;
        --focus: #8ab4f8;
        --scrim: rgba(0, 0, 0, 0.6);
    }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
input::-webkit-date-and-time-value { text-align: left; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.4 'Plex Sans', -apple-system, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
}
.wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px);
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px 14px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; }
.title { flex: 1; min-width: 0; }
.title h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.title .step { font-size: 12px; color: var(--muted); font-family: 'Plex Mono', ui-monospace, monospace; }
.icon-btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 10px; min-width: 44px; height: 44px; font: inherit; font-size: 14px; padding: 0 12px; flex: 0 0 auto;
}
.hidden { display: none !important; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.panel-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chip { font-size: 12px; color: var(--muted); font-family: 'Plex Mono', ui-monospace, monospace; text-align: right; }
.chip.ok { color: var(--accent); }
.chip.bad { color: var(--bad); }
.link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; padding: 6px 0 6px 8px; min-height: 40px; }
.link-btn.left { padding-left: 0; }
a.link-btn { display: inline-flex; align-items: center; text-decoration: none; }
.link-btn:disabled { color: var(--muted); }
.actions-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }

/* instrument readouts */
.readouts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.readout { background: var(--field); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.readout .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.readout .v { font-family: 'Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: 16px; margin-top: 2px; overflow-wrap: anywhere; }
.readout.wide { grid-column: 1 / -1; }
.readout .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

label.f { display: block; margin-top: 10px; }
label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
label.f > span em { font-style: normal; color: var(--bad); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.row2 > * { min-width: 0; }
input, select, textarea {
    width: 100%; min-width: 0; max-width: 100%; display: block; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--field); border: 1px solid transparent; border-radius: 10px;
    padding: 11px 12px; min-height: 46px; appearance: none; -webkit-appearance: none;
}
textarea { resize: vertical; min-height: 84px; }
input.mono, textarea.mono { font-family: 'Plex Mono', ui-monospace, monospace; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hint.warn { color: var(--warn); }
.hint.bad { color: var(--bad); }
details.hint summary { min-height: 40px; display: flex; align-items: center; }

.banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.ok { background: var(--ok-bg); color: var(--accent); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner .link-btn { color: inherit; text-decoration: underline; padding: 0 0 0 4px; min-height: 32px; }

/* option lists and chips (large touch targets) */
.opts { display: grid; gap: 8px; }
.opt {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px; text-align: left;
    border-radius: 12px; border: 2px solid transparent; background: var(--field); color: var(--ink); font: inherit; font-size: 16px;
}
.actions-row .opt { flex: 1; width: auto; min-width: 0; }
.opt .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex: 0 0 auto; }
.opt.multi .dot { border-radius: 5px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--accent); background: var(--ok-bg); }
.opt[aria-pressed="true"] .dot, .opt[aria-checked="true"] .dot { background: var(--accent); border-color: var(--accent); }
.opt.warn[aria-pressed="true"], .opt.warn[aria-checked="true"] { border-color: var(--warn); background: var(--warn-bg); }
.opt.warn[aria-pressed="true"] .dot, .opt.warn[aria-checked="true"] .dot { background: var(--warn); border-color: var(--warn); }
.opt.bad[aria-pressed="true"], .opt.bad[aria-checked="true"] { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad[aria-pressed="true"] .dot, .opt.bad[aria-checked="true"] .dot { background: var(--bad); border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt { width: auto; min-height: 44px; padding: 8px 14px; font-size: 15px; }
.chips .opt .dot { display: none; }
.follow { margin: -2px 0 6px 0; }

/* checklist rows */
.group-h { font-size: 12px; color: var(--muted); margin: 14px 2px 6px; letter-spacing: 0.04em; }
.group-h:first-child { margin-top: 0; }
.ck { border-radius: 12px; background: var(--field); margin-bottom: 8px; border: 2px solid transparent; }
.ck[data-s="pass"] { border-color: var(--accent); background: var(--ok-bg); }
.ck[data-s="issue"] { border-color: var(--bad); background: var(--bad-bg); }
.ck[data-s="na"] { border-color: var(--line); }
.ck-top { display: flex; align-items: stretch; }
.ck-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 58px;
    border: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; text-align: left;
}
.ck-icon {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; line-height: 1;
}
.ck[data-s="pass"] .ck-icon { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ck[data-s="issue"] .ck-icon { background: var(--bad); border-color: var(--bad); color: #fff; }
.ck[data-s="na"] .ck-icon { border-style: dashed; color: var(--muted); }
.ck-label { min-width: 0; }
.ck-label small { display: block; font-size: 12px; color: var(--muted); }
.ck-side { display: flex; align-items: center; gap: 4px; padding-right: 6px; }
.ck-btn {
    min-width: 46px; min-height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 0 8px;
}
.ck-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ck-btn.info { min-width: 40px; border-radius: 50%; font-family: 'Plex Mono', ui-monospace, monospace; }
.ck-more { padding: 0 12px 12px 52px; }
.ck-more .hint { margin: 0 0 6px; font-size: 13px; }
.ck-more input { font-size: 16px; min-height: 42px; background: var(--panel); }
.progress { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--accent); width: 0; }

/* active flight */
.timer { font-family: 'Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: 64px; letter-spacing: -0.02em; text-align: center; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
.rec { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--bad); }
.rec i { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; }

/* review */
dl.review { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 15px; }
dl.review dt { color: var(--muted); }
dl.review dd { margin: 0; font-family: 'Plex Mono', ui-monospace, monospace; overflow-wrap: anywhere; }
.tag { display: inline-block; font-family: 'Plex Sans', sans-serif; font-size: 11px; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; background: var(--field); color: var(--muted); white-space: nowrap; }
.tag.captured { background: var(--ok-bg); color: var(--accent); }
.tag.estimated, .tag.corrected { background: var(--warn-bg); color: var(--warn); }
.tag.missing { background: var(--bad-bg); color: var(--bad); margin-left: 0; }
.ck-list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.ck-list li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.ck-list li:last-child { border-bottom: 0; }
.ck-list .st { flex: 0 0 82px; font-family: 'Plex Mono', ui-monospace, monospace; font-size: 12px; padding-top: 2px; }
.ck-list .st.pass { color: var(--accent); }
.ck-list .st.issue { color: var(--bad); }
.ck-list .st.none { color: var(--warn); }

.dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.dock .inner { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; }
.btn {
    flex: 1; min-height: 54px; border-radius: 14px; border: 0; font: inherit; font-weight: 600; font-size: 17px;
    background: var(--accent); color: var(--accent-ink); padding: 0 14px;
}
.btn.secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; padding: 0 18px; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.big { min-height: 64px; font-size: 19px; }
.btn.block { display: block; width: 100%; margin-top: 14px; }
.btn:disabled { opacity: 0.5; }

/* bottom sheet */
.sheet-back { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
    background: var(--panel); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 85vh; overflow-y: auto;
}
.sheet h3 { margin: 0 0 8px; font-size: 18px; }
.sheet p, .sheet li { font-size: 15px; }
.sheet ul { padding-left: 20px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.sheet-actions .btn { flex: 0 0 auto; width: 100%; }

.tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tok { font-family: 'Plex Mono', ui-monospace, monospace; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--field); }
.tok.found { background: var(--ok-bg); color: var(--accent); }
.tok.missing.rec { background: var(--warn-bg); color: var(--warn); }
.tok.missing.req { background: var(--bad-bg); color: var(--bad); }
.steps { padding-left: 20px; margin: 6px 0 0; font-size: 14px; }
.steps li { margin-bottom: 6px; }
code { font-family: 'Plex Mono', ui-monospace, monospace; font-size: 13px; background: var(--field); padding: 1px 5px; border-radius: 4px; }
.big-q { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
</style>
</head>
<body>
<div class="wrap">
    <header class="top" id="top"></header>
    <main id="view"></main>
</div>
<div class="dock"><div class="inner" id="dock"></div></div>

<script>
'use strict';
(function () {
    // =====================================================================
    // Config
    // =====================================================================
    var BUILD = '98470e5';
    // Hosts a pre-filled link may point at. Prevents a tampered setup link from sending entries elsewhere.
    var FORM_HOSTS = ['forms.office.com', 'forms.office365.us', 'forms.osi.office365.us', 'forms.microsoft.com', 'forms.cloud.microsoft'];
    // Form codes. req = the form must have it; rec = recommended (Setup and Review warn when missing).
    var FIELDS = [
        { tok: 'date', label: 'Date', req: true },
        { tok: 'time', label: 'Start time', req: true },
        { tok: 'model', label: 'Model', req: true },
        { tok: 'duration', label: 'Duration (min)', req: true },

        { tok: 'lng', label: 'Longitude', rec: true },
        { tok: 'gps', label: 'Location source', rec: true },
        { tok: 'preflight', label: 'Preflight', rec: true },
        { tok: 'issues', label: 'Issues', rec: true },
        { tok: 'postcheck', label: 'Postflight inspection', rec: true },
        { tok: 'open', label: 'Open items', rec: true },
        { tok: 'site', label: 'Site' },
        { tok: 'manufacturer', label: 'Manufacturer' },
        { tok: 'card', label: 'Project / task card' },
        { tok: 'batteries', label: 'Batteries' },
        { tok: 'observer', label: 'Spotter' },
        { tok: 'altitude', label: 'Max alt (m AGL, est.)' },
        { tok: 'incident', label: 'Incident' },
        { tok: 'wind', label: 'Wind' },
        { tok: 'temp', label: 'Temp' },
        { tok: 'humidity', label: 'Humidity' },
        { tok: 'conditions', label: 'Conditions' },
        { tok: 'wxsource', label: 'Weather source' },
        { tok: 'observed', label: 'Operational conditions' },
        { tok: 'notes', label: 'Notes' }
    ];
    var MISSIONS = ['Recreational', 'Photography / Videography', 'Inspection', 'Mapping / Surveying', 'Research / Testing', 'Training', 'Drone Show', 'Other'];
    var PRE = [
        { id: 'frame', short: 'Frame/arms', label: 'Frame / arms secure', crit: true, group: 'Airframe & power', help: 'Arms locked, no cracks, fasteners tight, landing gear sound.' },
        { id: 'battery', short: 'Battery', label: 'Battery charged / secure / undamaged', crit: true, help: 'Charged for the planned flight (plus reserve), latched, no swelling, dents or damaged leads.' },
        { id: 'nav', short: 'GPS/compass/IMU', label: 'GPS / compass / IMU status', crit: true, group: 'Navigation & links', help: 'As shown on your controller or app: satellite connection, compass calibrated if prompted, no compass or IMU warnings. This app does not read them.' },
        { id: 'link', short: 'Telemetry/video', label: 'Telemetry / video (camera / FPV) link', na: true, help: 'Camera or FPV feed and telemetry showing normally on your controller, phone or tablet. Mark N/A if the aircraft has neither.' },
        { id: 'payload', short: 'Payload', label: 'Payload secure', na: true, group: 'Payload & propulsion', help: 'Camera, gimbal or sensor mounted and locked; cables secured. N/A if none fitted.' },
        { id: 'props', short: 'Motors/props', label: 'Motors / propellers inspected', crit: true, help: 'Props undamaged, correct orientation and tight; motors spin freely with no grit or noise.' },
        { id: 'fc', short: 'FC/firmware', label: 'Flight controller / firmware checked', crit: true, group: 'Control & failsafe', help: 'Expected firmware and parameters loaded; no arming warnings.' },
        { id: 'rc', short: 'RC/failsafe', label: 'RC link / failsafe checked', crit: true, help: 'Controller charged and powered on, apps running, link bound, range check if required, failsafe action set.' },
        { id: 'rth', short: 'RTH/RTL', label: 'Return-to-home / RTL settings', crit: true, na: true, help: 'Home point and return altitude suit this site’s obstacles. N/A if the aircraft has no return-to-home.' },
        { id: 'notam', short: 'NOTAMs/TFRs/authorization', label: 'FAA NOTAMs / TFRs checked, authorization obtained if required', crit: true, group: 'Operation',
            help: 'Check NOTAMs and TFRs for this location and time. In controlled airspace, have LAANC or other FAA authorization before flying.',
            links: [['FAA NOTAM Search', 'https://notams.aim.faa.gov/notamSearch/'], ['FAA TFR list', 'https://tfr.faa.gov/'], ['B4UFLY', 'https://www.faa.gov/uas/getting_started/b4ufly']] },
        { id: 'site', short: 'Site/people/wx', label: 'Site, people & weather reviewed', crit: true, help: 'Site hazards and obstacles, people nearby and standoff distance, weather within your and the aircraft\u2019s limits.' }
    ];
    var POST = [
        { id: 'battery', short: 'Battery', label: 'Battery disconnected / inspected', link: ['battery'] },
        { id: 'props', short: 'Props/frame', label: 'Propellers / frame / landing gear inspected', help: 'Chips, cracks or loose props; cracked arms or shell; landing gear and any signs of a hard landing.', link: ['props', 'hard'] },
        { id: 'motors', short: 'Motors/ESCs', label: 'Motors / ESCs checked for heat or unusual behavior', link: ['motor'] },
        { id: 'payload', short: 'Payload', label: 'Payload and accessories inspected', na: true, link: ['payload'] }
    ];
    var OUTCOMES = [
        { id: 'normal', label: 'Completed normally' },
        { id: 'issue', label: 'Completed with an issue', cls: 'warn' },
        { id: 'aborted', label: 'Aborted before completion', cls: 'warn' },
        { id: 'emergency', label: 'Emergency landing / emergency termination', cls: 'bad' }
    ];
    var ISSUES = [
        { id: 'none', label: 'No issues observed', excl: true },
        { id: 'battery', label: 'Battery issue' },
        { id: 'props', label: 'Propeller or frame issue' },
        { id: 'motor', label: 'Motor / ESC overheating or unusual behavior' },
        { id: 'nav', label: 'GPS / compass / navigation issue' },
        { id: 'link', label: 'RC, telemetry, or video-link issue' },
        { id: 'fc', label: 'Flight-controller warning or unexpected behavior' },
        { id: 'payload', label: 'Payload issue' },
        { id: 'hard', label: 'Hard landing or suspected damage', crit: true },
        { id: 'other', label: 'Other' },
        { id: 'unassessed', label: 'Not yet assessed', excl: true }
    ];
    var STEPS = ['preflight', 'active', 'outcome', 'inspect', 'review'];
    var STEP_LABEL = { home: 'Flight details', preflight: 'Preflight checklist', active: 'Flight in progress', outcome: 'Postflight', inspect: 'Postflight inspection', review: 'Review' };
    var LONG_FLIGHT_MIN = 90;   // ask to verify the end time beyond this
    var ALT_LIMIT_M = 122;      // 400 ft AGL
    var URL_WARN = 7000;        // very long pre-filled links may be cut off

    var K = { settings: 'flightlog.settings.v1', prefs: 'flightlog.prefs.v1', flights: 'flightlog.flights.v1',
        current: 'flightlog.current.v1', carry: 'flightlog.carry.v1', oldDraft: 'flightlog.draft.v1' };

    var $ = function (id) { return document.getElementById(id); };
    var store = {
        get: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
        del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
    };

    var settings = store.get(K.settings) || { url: '', models: ['M1'] };
    var prefs = store.get(K.prefs) || { aircraft: [], selected: null, mission: '', site: '', observer: '', pilot: '' };
    var flights = store.get(K.flights) || {};
    var carry = store.get(K.carry) || {};
    var currentId = store.get(K.current);
    var ui = { view: 'home', handoffId: null, aircraftReturn: 'home', lastDone: null, gps: '', wx: '', showManualLoc: false, wxManualOpen: false, timer: null, openHelp: {} };

    // =====================================================================
    // Helpers
    // =====================================================================
    function pad(n) { return String(n).padStart(2, '0'); }
    function localDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function localTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    function isoZ(d) { return d.toISOString().replace(/\.\d{3}Z$/, 'Z'); }
    function utcOffset(d) {
        var m = -d.getTimezoneOffset(), s = m >= 0 ? '+' : '-';
        m = Math.abs(m);
        return 'UTC' + s + pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    }
    function tzName() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } }
    function toLocalInput(iso) { var d = new Date(iso); return localDate(d) + 'T' + localTime(d); }
    function fromLocalInput(v) { var d = new Date(v); return v && !isNaN(d) ? isoZ(d) : null; }
    function fmtClock(ms) {
        var s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
        return (hh ? hh + ':' + pad(mm) : pad(mm)) + ':' + pad(ss);
    }
    function fmtDur(ms) {
        var m = Math.round(ms / 60000);
        return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min';
    }
    function durMin(r) { return (r.startAt && r.endAt) ? (new Date(r.endAt) - new Date(r.startAt)) / 60000 : null; }
    function clean(s) {
        // strip control, zero-width and bidi-override characters; normalize look-alikes
        return String(s == null ? '' : s).normalize('NFC')
            .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F​-‏‪-‮⁦-⁩﻿]/g, '')
            .trim();
    }
    function cardinal(deg) {
        var dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
        return dirs[Math.round(deg / 22.5) % 16];
    }
    function uuid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        var b = crypto.getRandomValues(new Uint8Array(16));
        b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
        var x = Array.prototype.map.call(b, function (n) { return n.toString(16).padStart(2, '0'); }).join('');
        return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
    }
    function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

    // DOM builder: text only, never innerHTML.
    function h(tag, props) {
        var el = document.createElement(tag);
        if (props) Object.keys(props).forEach(function (k) {
            var v = props[k];
            if (v == null || v === false) return;
            if (k === 'class') el.className = v;
            else if (k === 'text') el.textContent = v;
            else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
            else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = v;
            else el.setAttribute(k, v === true ? '' : v);
        });
        for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
        return el;
    }
    function add(el, c) {
        if (arguments.length > 2) { for (var i = 1; i < arguments.length; i++) add(el, arguments[i]); return; }
        if (c == null || c === false) return;
        if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
        el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    function panel(title, right) {
        var kids = Array.prototype.slice.call(arguments, 2);
        return h('section', { class: 'panel' }, title ? h('div', { class: 'panel-head' }, h('h2', { text: title }), right || null) : null, kids);
    }
    function field(label, input, required) { return h('label', { class: 'f' }, h('span', null, label, required ? h('em', { text: ' *' }) : null), input); }
    function tag(kind, text) { return h('span', { class: 'tag ' + kind, text: text }); }

    function sheet(title, body, actions) {
        var back = h('div', { class: 'sheet-back' });
        var close = function () { back.remove(); };
        var box = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
            h('h3', { text: title }), body,
            h('div', { class: 'sheet-actions' }, actions.map(function (a) {
                return h('button', { type: 'button', class: 'btn' + (a.primary ? '' : a.danger ? ' danger' : ' secondary'),
                    onclick: function () { close(); if (a.fn) a.fn(); } }, a.label);
            })));
        back.appendChild(box);
        back.addEventListener('click', function (e) { if (e.target === back) close(); });
        document.body.appendChild(back);
    }

    // =====================================================================
    // Persistence (on-device drafts; the Microsoft Form is the system of record)
    // =====================================================================
    var storageWarned = false;
    function saveAll() {
        var a = store.set(K.flights, flights), b = store.set(K.prefs, prefs), c = store.set(K.carry, carry);
        if (currentId) store.set(K.current, currentId); else store.del(K.current);
        if (!(a && b && c) && !storageWarned) {
            storageWarned = true;
            sheet('Can’t save on this phone', h('p', { text: 'Safari blocked storage (Private Browsing or storage full). Entries will be lost if the app closes. Open the app outside Private Browsing.' }), [{ label: 'OK', primary: true }]);
        }
        return a && b && c;
    }
    function cur() { return currentId ? flights[currentId] || null : null; }
    function touch(r) { r.updatedAt = isoZ(new Date()); flights[r.id] = r; return saveAll(); }

    function selectedAircraft() { return byId(prefs.aircraft, prefs.selected); }
    function carryFor(serial) { return serial && carry[serial] ? carry[serial] : null; }
    // Before takeoff a draft always reflects the current open items for its aircraft
    // (they may have been recorded after the draft was created, or the aircraft changed).
    function syncCarry(r) {
        if (!r || r.startAt) return;
        var serial = r.aircraft && r.aircraft.serial, c = carryFor(serial);
        var want = c && !c.resolvedAt ? { serial: serial, text: c.text, from: c.at, resolvedAt: null } : null;
        var resolvedHere = r.carry && r.carry.resolvedAt && r.carry.serial === serial;
        if (resolvedHere) return;
        if (JSON.stringify(want) !== JSON.stringify(r.carry)) { r.carry = want; touch(r); }
    }

    function newRecord() {
        var a = selectedAircraft(), now = new Date();
        var c = a ? carryFor(a.serial) : null;
        var r = {
            v: 2, id: uuid(), createdAt: isoZ(now), tz: tzName(), status: 'draft', step: 'home',
            aircraft: a ? { manufacturer: a.manufacturer || '', model: a.model, serial: a.serial } : null,
            mission: prefs.mission || '', missionOther: prefs.missionOther || '', site: prefs.site || '', observer: prefs.observer || '', pilot: '',
            card: '', batteries: '', observed: '',
            location: null, weather: null,
            pre: {}, preAck: null,
            carry: c ? { serial: a.serial, text: c.text, from: c.at, resolvedAt: c.resolvedAt || null } : null,
            startAt: null, endAt: null, corrections: [],
            outcome: '', outcomeNote: '', issues: [], issueNotes: {}, incident: { what: '', harm: '' },
            post: {}, altitude: '', notes: '', returnTo: null, attempts: 0
        };
        if (c && c.resolvedAt) delete carry[a.serial];
        flights[r.id] = r;
        currentId = r.id;
        saveAll();
        return r;
    }

    // One-time migration of a draft saved by the previous single-screen version.
    function migrateOldDraft() {

    // =====================================================================

        it.s = s;

    // =====================================================================
    // Derived values: summaries, open items, flags

        PRE.forEach(function (d) {
            var it = item(r.pre, d.id);

        var serial = r.aircraft && r.aircraft.serial;
        if (serial) {
            var unresolved = open.filter(function (o) { return !o.carried; });
            if (r.carry && !r.carry.resolvedAt) unresolved.unshift({ text: r.carry.text });
            if (unresolved.length) carry[serial] = { text: unresolved.map(function (o) { return o.text; }).join('; '), at: r.endAt || r.finalizedAt, flightId: r.id };
        }
        ui.lastDone = { aircraft: r.aircraft, duration: durMin(r), outcome: (byId(OUTCOMES, r.outcome) || {}).label, open: open.length, id: r.id };
        delete flights[r.id]; // submitted: nothing from this flight is kept on the phone
        if (currentId === r.id) currentId = null;
        ui.handoffId = null;
        saveAll();
        go('done');
    }
    VIEWS.handoff = function (top, view, dock) {
        var r = flights[ui.handoffId];
        if (!r) { go('home'); return; }
        header(top, 'Submit to form', null);
        var summary = (r.aircraft ? r.aircraft.serial || r.aircraft.model : '') + ' · ' + (r.startAt ? localDate(new Date(r.startAt)) + ' ' + fmtTime(new Date(r.startAt)) : '') + ' · Flight ID ' + r.id.slice(0, 8);
        if (r.status === 'pending') {
            add(view, h('div', { class: 'banner warn', id: 'pending-banner' }, h('strong', { text: 'Saved on this phone, not submitted yet.' }),
                h('div', { text: navigator.onLine ? 'Open the form to submit it.' : 'No signal, so the form can’t open. Submit it when you’re back online; it waits on the Home screen.' })));
            add(view, h('div', { class: 'hint', text: summary }));
            add(view, h('button', { class: 'link-btn left', type: 'button', id: 'btn-next-pending', onclick: startNext }, 'Start next flight'));
            if (navigator.onLine && settings.signedInAt) add(view, signInHelp(r));
            primary(dock, 'Open form', function () {
                if (!navigator.onLine) { sheet('Still offline', h('p', { text: 'The phone has no connection. The log stays saved here.' }), [{ label: 'OK', primary: true }]); return; }
                openForm(r);
            }, { id: 'btn-open', secondary: { label: 'Home', fn: function () { go('home'); } }, secondaryId: 'btn-home' });
            return;
        }
        add(view, h('section', { class: 'panel' },
            h('p', { class: 'big-q', text: 'Did Microsoft Forms say your response was submitted?' }),
            h('div', { class: 'hint', text: 'This app can’t see the form, so only you can confirm it. ' + summary })));
        add(view, h('div', { class: 'hint', text: 'Not sure? Open the form again and check. If it goes in twice, both rows share the same Flight ID in Excel, so the duplicate is easy to remove.' }));
        add(view, h('div', { class: 'actions-row' },
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-reopen', onclick: function () { openForm(r); } }, 'Open the form again'),
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-keep', onclick: function () { r.status = 'pending'; touch(r); render(); } }, 'Form didn’t load – keep for later'),
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-back-review', onclick: function () {
                if (cur() && cur() !== r) { sheet('Finish the current flight first', h('p', { text: 'Another flight is in progress. Finish or discard it, then change this one.' }), [{ label: 'OK', primary: true }]); return; }
                r.status = 'draft'; r.step = 'review'; currentId = r.id; ui.handoffId = null; touch(r); go('review');
            } }, 'Change something')));
        add(view, signInHelp(r));
        primary(dock, 'Yes, it was submitted', function () { confirmSubmitted(r); }, { id: 'btn-submitted', big: true });
    };

    // ---------- Screen 9: Done / repeated flights ----------
    function startNext() {
        // stable preferences live in prefs; everything flight-specific starts fresh
        ui.gps = ''; ui.wx = ''; ui.showManualLoc = false; ui.wxManualOpen = false; ui.openHelp = {}; ui.handoffId = null; ui.lastDone = null;
        go('home');
    }
    VIEWS.done = function (top, view, dock) {
        var d = ui.lastDone;
        if (!d) { go('home'); return; }
        header(top, 'Flight logged', null);
        add(view, h('div', { class: 'banner ok', id: 'done-banner' }, h('strong', { text: 'Submitted to your form.' }), h('div', { text: 'Nothing from this flight is kept on the phone.' })));
        add(view, panel('Summary', null, h('dl', { class: 'review' },
            h('dt', { text: 'Aircraft' }), h('dd', { text: d.aircraft ? d.aircraft.model + ' · ' + (d.aircraft.serial || '—') : '—' }),
            h('dt', { text: 'Duration' }), h('dd', { text: d.duration == null ? '—' : fmtDur(d.duration * 60000) }),
            h('dt', { text: 'Outcome' }), h('dd', { text: d.outcome || '—' }),
            h('dt', { text: 'Flight ID' }), h('dd', { text: d.id }))));
        if (d.open) add(view, h('div', { class: 'banner warn', text: 'This log has open items. They’ll be shown before the next flight of this aircraft until you mark them resolved.' }));
        primary(dock, 'Start Next Flight', startNext, { id: 'btn-next', big: true, secondary: { label: 'Home', fn: function () { ui.lastDone = null; go('home'); } }, secondaryId: 'btn-home' });
    };

    // ---------- Settings (existing Setup screen) ----------
    function renderTokens(box, found) {
        box.textContent = '';
        FIELDS.forEach(function (f) {
            add(box, h('span', { class: 'tok ' + (found && found[f.tok] ? 'found' : 'missing') + (f.req ? ' req' : f.rec ? ' rec' : ''),
                title: f.label + (f.req ? ' (required)' : f.rec ? ' (recommended)' : ''), text: '__' + f.tok + '__' }));
        });
    }
    function checkSetupUrl(raw, msg, box) {
        if (!raw.trim()) { msg.textContent = 'Red codes are required, amber recommended. Green means found in your link.'; msg.className = 'hint'; renderTokens(box, null); return null; }
        var p = parseFormUrl(raw);
        if (p.error) { msg.textContent = p.error; msg.className = 'hint warn'; renderTokens(box, null); return null; }
        var miss = FIELDS.filter(function (f) { return f.req && !p.found[f.tok]; }).map(function (f) { return '__' + f.tok + '__'; });
        var none = FIELDS.every(function (f) { return !p.found[f.tok]; });
        var recMiss = FIELDS.filter(function (f) { return f.rec && !p.found[f.tok]; }).length;
        msg.textContent = none
            ? 'This is the form’s normal share link. In Forms, use ⋯ → Get pre-filled URL, type each code below into its question, then copy that link.'
            : miss.length ? 'Missing required codes: ' + miss.join(' ')
            : 'All required codes found.' + (recMiss ? ' ' + recMiss + ' recommended code' + (recMiss > 1 ? 's' : '') + ' missing.' : '');
        msg.className = 'hint' + (miss.length || none ? ' warn' : '');
        renderTokens(box, p.found);
        return miss.length ? null : p;
    }
    function parseModels(s) {
        return clean(s).split(',').map(clean).filter(Boolean).slice(0, 20).map(function (m) { return m.slice(0, 40); });
    }
    function b64urlEncode(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
    function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }

    VIEWS.settings = function (top, view, dock) {
        var leave = function () { go('home'); };
        header(top, 'Setup', leave);
        var url = h('textarea', { id: 's-url', class: 'mono', rows: 4, autocomplete: 'off', spellcheck: 'false', autocapitalize: 'off', placeholder: 'https://forms.office.com/Pages/ResponsePage.aspx?id=…', value: settings.url || '' });
        var msg = h('div', { class: 'hint', id: 's-url-msg' });
        var toks = h('div', { class: 'tokens', id: 's-tokens' });
        var models = h('input', { id: 's-models', autocomplete: 'off', placeholder: 'M1', value: (settings.models || []).join(', ') });
        url.addEventListener('input', function () { checkSetupUrl(url.value, msg, toks); });
        add(view, panel('Connect your form', null,
            h('ol', { class: 'steps' },
                h('li', null, 'In Microsoft Forms, add one ', h('strong', { text: 'Text' }), ' question per field (no number or date restrictions).'),
                h('li', null, 'Click ', h('strong', { text: '⋯ → Get pre-filled URL' }), '. In each question, type its code from the list below, for example ', h('code', { text: '__flightid__' }), '.'),
                h('li', { text: 'Copy the link and paste it here.' })),
            field('Pre-filled form link', url), msg, toks,
            field('Aircraft models (comma-separated)', models)));
        checkSetupUrl(url.value, msg, toks);
        var shareMsg = h('div', { class: 'hint', id: 'share-msg' });
        if (formStatus().ok) add(view, panel('Sign in to Microsoft Forms', settings.signedInAt ? h('span', { class: 'chip ok', text: 'done on this phone' }) : null,
            h('div', { class: 'hint', text: 'Do this once per phone, and again if Microsoft signs you out. Pre-filled links can\u2019t take you through Microsoft sign-in (error AADSTS90015), so sign in with the plain form first.' }),
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-signin-setup', onclick: function () { signInToForms(null); } }, 'Open the form to sign in')));
        add(view, panel('Share with other pilots', null,
            h('div', { class: 'hint', text: 'This makes a link that sets up another phone with the same form. Send it only through company channels.' }),
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-share', onclick: function () {
                var p = parseFormUrl(settings.url || '');
                if (p.error) { shareMsg.textContent = 'Save a valid form link first.'; return; }
                var link = location.origin + location.pathname + '#setup=' + b64urlEncode(JSON.stringify({ url: settings.url, models: settings.models }));
                var done = function () { shareMsg.textContent = 'Copied.'; };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { prompt('Copy this link:', link); });
                else prompt('Copy this link:', link);
            } }, 'Copy setup link'), shareMsg));
        add(view, panel('On this phone', null,
            h('div', { class: 'hint', text: 'Settings, aircraft and unfinished flights are kept only in this browser until submitted. The weather lookup sends your position rounded to about 1 km. Nothing else leaves the phone until you submit the form.' }),
            h('button', { class: 'link-btn left', type: 'button', id: 'btn-wipe', onclick: function () {
                var n = Object.keys(flights).length;
                sheet('Clear everything on this phone?', h('p', { text: 'Removes the form link, aircraft list, preferences' + (n ? ' and ' + n + ' unsubmitted flight' + (n > 1 ? 's, which will be lost' : ', which will be lost') : '') + '.' }),
                    [{ label: 'Cancel', primary: true }, { label: 'Clear everything', danger: true, fn: function () {
                        [K.settings, K.prefs, K.flights, K.current, K.carry].forEach(store.del);
                        settings = { url: '', models: ['M1'] }; prefs = { aircraft: [], selected: null, mission: '', site: '', observer: '', pilot: '' };
                        flights = {}; carry = {}; currentId = null;
                        render();
                    } }]);
            } }, 'Clear settings and data'),
            h('div', { class: 'hint' }, 'Build ', h('code', { text: BUILD }))));
        primary(dock, 'Save', function () {
            var p = checkSetupUrl(url.value, msg, toks);
            if (!p) {
                var why = msg.textContent;
                sheet('Can’t save yet', h('p', { text: /^Red codes/.test(why) ? 'Paste your pre-filled form link first.' : why }), [{ label: 'OK', primary: true, fn: function () { url.focus(); } }]);
                return;
            }
            var ms = parseModels(models.value);
            settings = { url: p.url, models: ms.length ? ms : ['M1'] };
            store.set(K.settings, settings);
            go('home');
        }, { id: 'btn-setup-save', secondary: { label: 'Back', fn: leave }, secondaryId: 'btn-setup-cancel' });
    };

    // Setup arrives in the #fragment, which browsers never send to the web server.
    function importFromHash() {
        var m = /^#setup=([A-Za-z0-9_-]+)$/.exec(location.hash);
        if (!m) return;
        history.replaceState(null, '', location.pathname + location.search);
        try {
            var s = JSON.parse(b64urlDecode(m[1]));
            var p = parseFormUrl(s.url || '');
            if (p.error) { alert('Setup link rejected: ' + p.error); return; }
            var models = Array.isArray(s.models) ? parseModels(s.models.join(',')) : ['M1'];
            if (!confirm('Connect this phone to the form at ' + new URL(p.url).hostname + '?\nModels: ' + models.join(', '))) return;
            settings = { url: p.url, models: models.length ? models : ['M1'] };
            store.set(K.settings, settings);
        } catch (e) { alert('That setup link is damaged.'); }
    }

    // =====================================================================
    // Start
    // =====================================================================
    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && (ui.view === 'active' || ui.view === 'handoff')) render();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
    window.addEventListener('online', function () { if (ui.view === 'handoff' || ui.view === 'home') render(); });

    importFromHash();
    migrateOldDraft();
    if (currentId && !flights[currentId]) currentId = null;
    Object.keys(flights).forEach(function (k) { if (flights[k].step === 'flightsetup') flights[k].step = 'home'; });
    var inHandoff = Object.keys(flights).map(function (k) { return flights[k]; }).filter(function (r) { return r.status === 'handoff' || r.awaitingSignIn; })
        .sort(function (a, b) { return a.handoffAt < b.handoffAt ? 1 : -1; })[0];
    if (inHandoff) { ui.handoffId = inHandoff.id; ui.view = 'handoff'; }
    else if (cur() && STEPS.indexOf(cur().step) !== -1) ui.view = cur().step; // resume where the pilot left off
    render();

    if ('serviceWorker' in navigator && window.isSecureContext) {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline start unavailable */ });
    }
})();
</script>
</body>
